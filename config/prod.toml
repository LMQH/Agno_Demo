[app]
name = "agno-rag-system"
environment = "prod"
debug = false
host = "0.0.0.0"
port = 8000

[database.mysql]
host = "localhost"
port = 3306
user = "agno_user"
password = "prod_password"
database = "agno_rag_prod"
charset = "utf8mb4"
pool_size = 20

[database.milvus]
host = "localhost"
port = 19530
database = "default"
collection_name = "agno_rag_prod"
dimension = 1024
index_type = "IVF_FLAT"
metric_type = "L2"

[model.embedding]
provider = "openai"
model_name = "text-embedding-v4"
api_key = ""
api_base = "https://api.openai.com/v1"
dimension = 1024

[model.llm]
provider = "custom"
model_name = "deepseek-v3.2-exp"
api_base = ""
api_key = ""
temperature = 0.7
max_tokens = 2000

[rag]
chunk_size = 500
chunk_overlap = 50
top_k = 5
similarity_threshold = 0.7

[agent_db]
enabled = true
num_history_runs = 5

